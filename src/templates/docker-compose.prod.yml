# Production stack for __PROJECT__, in Coolify's native compose format.
#
# No host ports are published: Coolify's Traefik proxy routes to the container
# port declared in the labels below. The only services here are the app and the
# CMS. MongoDB and Redis are SHARED external services, the same ones QA points
# at - a stack does not run its own copies, it separates itself by database name
# and Redis database index.
#
# Required variables in Coolify:
#   SERVICE_FQDN_APP        e.g. __PROJECT__.example.com
#   SERVICE_FQDN_CMS        e.g. cms.__PROJECT__.example.com
#                           Coolify generates both. Referenced ONLY as a bare
#                           ${SERVICE_FQDN_APP} inside the Traefik rule: Coolify
#                           recognises its magic variables by that exact form,
#                           so `${SERVICE_FQDN_APP:?...}` or listing the variable
#                           under `environment:` stops the domain from resolving.
#                           For several domains on the app, set SERVICE_FQDN_APP
#                           to one of them and add the rest in Coolify's domain
#                           field.
#   COCKPIT_API_TOKEN       MANDATORY: shared token between the app and Cockpit;
#                           without it /cache/purge refuses to operate (503)
#   COCKPIT_SEC_KEY         Cockpit's signing key - the image ships a public
#                           default, so this must be set to something private
#   MONGO_HOST              shared MongoDB host
#   MONGO_USER              MongoDB user
#   MONGO_PASSWORD          MongoDB password
#   REDIS_URL               page cache backend, e.g.
#                           redis://:pass@redis-host:6379/0. QA MUST use a
#                           different database index than this one.
#   COCKPIT_MEMORY_SERVER   Cockpit cache backend, e.g.
#                           redis://:pass@redis-host:6379
#
# Optional: MONGO_DB (defaults to the project name), MONGO_PORT (27017).
#
# MONGO_DB does more than name the database. cockpit/config.php uses it as the
# key prefix for Cockpit's app memory in Redis, and that memory holds the API
# key registry the /api/* gate reads. Giving two environments the same MONGO_DB
# would have them share one registry - so rotating one environment's
# COCKPIT_API_TOKEN would silently break the other. Keep them different.

services:
  __PROJECT__-prod-app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8080
      # Page-cache keys are compiled-in constants prefixed "__PROJECT__:" (see
      # internal/handlers and internal/seo). They do NOT vary by environment, so
      # two environments sharing one Redis database would read and overwrite
      # each other's rendered HTML. The database index in this URL is what keeps
      # the keyspaces apart.
      - REDIS_URL=${REDIS_URL}
      - COCKPIT_URL=http://__PROJECT__-prod-cms:80
      - COCKPIT_API_TOKEN=${COCKPIT_API_TOKEN}
      # Mongo parts so the app can build a credential-aware URI (see
      # buildMongoURI in internal/config) exactly like the CMS does.
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB:-__PROJECT__}
    labels:
      # Tells Coolify this service is built from the repository Dockerfile.
      - coolify.managed=true
      - coolify.image=true
      - traefik.enable=true
      # A bare ${SERVICE_FQDN_APP}, deliberately. 0.51.0 wrote `${SERVICE_FQDN_APP:?...}`
      # to fail the deploy on an unset domain, and listed the variable under
      # environment: - and neither works on Coolify, which only recognises its
      # magic variables in this exact form. Every project deployed from that
      # template had to have both removed by hand.
      - traefik.http.routers.__PROJECT__-app.rule=Host(`${SERVICE_FQDN_APP}`)
      - traefik.http.routers.__PROJECT__-app.entrypoints=https
      - traefik.http.routers.__PROJECT__-app.tls=true
      - traefik.http.routers.__PROJECT__-app.tls.certresolver=letsencrypt
      - traefik.http.services.__PROJECT__-app.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      __PROJECT__-prod-cms:
        condition: service_started

  __PROJECT__-prod-cms:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cms
    restart: unless-stopped
    environment:
      # Read by cockpit/config.php through Cockpit's ${VAR} resolution.
      - COCKPIT_SEC_KEY=${COCKPIT_SEC_KEY}
      - COCKPIT_MEMORY_SERVER=${COCKPIT_MEMORY_SERVER}
      - COCKPIT_DATABASE=${COCKPIT_DATABASE:-mongodb}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB:-__PROJECT__}
      # S3 storage (optional — only used when STORAGE_ADAPTER=s3)
      - STORAGE_ADAPTER=${STORAGE_ADAPTER:-local}
      - S3_URL=${S3_URL}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
      - S3_PREFIX=${S3_PREFIX}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_ACL=${S3_ACL:-}
      # No S3_VERIFY here on purpose: TLS verification toward the bucket is
      # never disabled in production. The local dev compose carries it for the
      # self-signed mkcert MinIO certificate.
      # CachePurge addon: the Go app's internal address and shared token so
      # Cockpit can POST to /cache/purge when content changes or Replica syncs.
      # Every service in this file is named for the project AND the
      # environment, and the internal URLs use those names.
      #
      # A generic `app`/`cms` is not safe here. Coolify deploys stacks onto a
      # shared predefined network, so a second stack for the same project - a QA
      # copy alongside production - registers the same names, DNS round-robins
      # between them, and the application ends up authenticating against the
      # other stack's CMS. That surfaces as `412 {"error":"Authentication
      # failed"}` on some requests and not others, which is a miserable thing to
      # diagnose because the site half works.
      #
      # Local development names the container instead (see docker-compose.yml),
      # for the same reason by a different route: there the service names are
      # kept so `gosite logs <project> app` keeps working. Do not "fix" one file
      # to match the other.
      - APP_URL=http://__PROJECT__-prod-app:8080
      - COCKPIT_API_TOKEN=${COCKPIT_API_TOKEN}
    volumes:
      # Uploads and cache still live on disk even when the data is in MongoDB.
      # Config and addons are NOT mounted here: Dockerfile.cms bakes the
      # committed cockpit/config.php and addons/ into the image. Relative bind
      # mounts (./cockpit/config.php, ./addons) resolve against the directory
      # where Coolify stores the pasted compose file, not the repo checkout, so
      # they silently mount empty directories. After a deploy that changes an
      # addon, clear storage/cache/modules.cache.php once so the CMS re-registers
      # it on the next boot.
      - cockpit-storage:/var/www/html/storage
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - traefik.http.routers.__PROJECT__-cms.rule=Host(`${SERVICE_FQDN_CMS}`)
      - traefik.http.routers.__PROJECT__-cms.entrypoints=https
      - traefik.http.routers.__PROJECT__-cms.tls=true
      - traefik.http.routers.__PROJECT__-cms.tls.certresolver=letsencrypt
      - traefik.http.services.__PROJECT__-cms.loadbalancer.server.port=80

volumes:
  cockpit-storage:
