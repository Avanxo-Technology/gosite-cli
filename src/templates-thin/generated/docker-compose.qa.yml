# generated by gosite generate from gosite.yml - do not edit.
# `gosite generate` rewrites this file. Put local changes in a second compose file added in Coolify.
#
# QA stack for __PROJECT__, in Coolify's native compose format.
#
# Mirrors docker-compose.prod.yml: the only services here are the app and the
# CMS. MongoDB and Redis are the SHARED external services - QA does not run its
# own copies, it points at the same servers as production and separates itself
# by database name and Redis database index (see the two notes below).
#
# Required variables in Coolify:
#   SERVICE_FQDN_APP        e.g. qa.__PROJECT__.example.com
#   SERVICE_FQDN_CMS        e.g. cms.qa.__PROJECT__.example.com
#   COCKPIT_API_TOKEN       shared token between the app and Cockpit - use a
#                           DIFFERENT value than production
#   COCKPIT_SEC_KEY         Cockpit's signing key - the image ships a public
#                           default, so this must be set to something private
#   MONGO_HOST              shared MongoDB host
#   MONGO_USER              MongoDB user
#   MONGO_PASSWORD          MongoDB password
#   REDIS_URL               MUST use a different database index than prod,
#                           e.g. redis://:pass@redis-host:6379/2 - and NEVER 1:
#                           cockpit/config.php pins Cockpit's memory there,
#                           keyed by MONGO_DB, so a QA purge of "__PROJECT__:*" on
#                           database 1 deletes production's API key registry.
#   COCKPIT_MEMORY_SERVER   e.g. redis://:pass@redis-host:6379
#
# Optional: MONGO_DB (defaults to __PROJECT__-qa), MONGO_PORT (27017).
#
# Optional, outgoing e-mail (Forms notifications, password resets): SMTP_HOST
# turns it on; with SMTP_PORT (587), SMTP_ENCRYPTION (tls|ssl|none), SMTP_USER,
# SMTP_PASSWORD, SMTP_FROM (a sender the provider has verified) and
# SMTP_FROM_NAME. Without SMTP_HOST the CMS sends no e-mail. A QA copy that
# shares production's SMTP credentials sends real mail - point it elsewhere.
#
# MONGO_DB does more than name the database. cockpit/config.php uses it as the
# key prefix for Cockpit's app memory in Redis, and that memory holds the API
# key registry the /api/* gate reads. Giving QA and production the same MONGO_DB
# would have them share one registry - so rotating one environment's
# COCKPIT_API_TOKEN would silently break the other. Keep them different.

services:
  __PROJECT__-qa-app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Not "development": IsDev() gates the unauthenticated cache-purge
      # button, and QA is a deployed environment reachable from the internet.
      # Anything other than development/dev/local keeps that endpoint behind
      # the API token, exactly as in production.
      - APP_ENV=qa
      - PORT=8080
      # Every Redis key is prefixed with GOSITE_PROJECT, the same in every
      # environment of this project. Two environments sharing one Redis
      # database would read and overwrite each other's pages: the database
      # index in REDIS_URL is what keeps the keyspaces apart.
      - GOSITE_PROJECT=__PROJECT__
      - REDIS_URL=${REDIS_URL}
      - COCKPIT_URL=http://__PROJECT__-qa-cms:80
      - COCKPIT_API_TOKEN=${COCKPIT_API_TOKEN}
      - STORAGE_ADAPTER=${STORAGE_ADAPTER:-local}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      # gosite:addon Commerce
      - COMMERCE_URL=http://__PROJECT__-qa-medusa:9000
      # gosite:end
    # gosite:addon Commerce
    volumes:
      - __PROJECT__-qa-commerce-key:/run/gosite-commerce:ro
    # gosite:end
    labels:
      # Tells Coolify this service is built from the repository Dockerfile.
      - coolify.managed=true
      - coolify.image=true
      - traefik.enable=true
      # The router/service name has to satisfy two separate constraints, and
      # missing either one 502s the site in a different way.
      #
      # 1. It must NOT equal the compose service name (__PROJECT__-qa-app).
      #    When they match, Coolify treats this as the service's own router and
      #    injects a per-domain https-N-... service whose load balancer port
      #    falls back to the default 3000 (ports_exposes), ignoring the port
      #    declared below.
      # 2. It must NOT equal production's router name either. Traefik keys its
      #    routing table by router name across every stack on the proxy, so two
      #    environments naming their routers alike define one router twice with
      #    different Host rules - and whichever container Traefik reads last
      #    wins. That surfaces as QA content on the production domain, or a
      #    domain that intermittently stops resolving, depending on deploy
      #    order.
      #
      # "-qa-web" satisfies both: distinct from the service name here, and
      # distinct from the "-app" production uses.
      - traefik.http.routers.__PROJECT__-qa-web.rule=Host(`${SERVICE_FQDN_APP}`)
      - traefik.http.routers.__PROJECT__-qa-web.entrypoints=https
      - traefik.http.routers.__PROJECT__-qa-web.tls=true
      - traefik.http.routers.__PROJECT__-qa-web.tls.certresolver=letsencrypt
      - traefik.http.services.__PROJECT__-qa-web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      __PROJECT__-qa-cms:
        condition: service_started

  __PROJECT__-qa-cms:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cms
      # gosite's Cockpit addons at the core version in gosite.yml, fetched by
      # BuildKit from the gosite repository. Nothing of them lives in this repo.
      additional_contexts:
        gosite-addons: "__ADDONS_CONTEXT_REMOTE__"
    restart: unless-stopped
    environment:
      # Read by cockpit/config.php through Cockpit's ${VAR} resolution.
      - COCKPIT_SEC_KEY=${COCKPIT_SEC_KEY}
      # Distinct session name so a browser signed into the QA CMS and the
      # production CMS on sibling domains does not share one session cookie.
      - COCKPIT_SESSION_NAME=__PROJECT__-qa
      - COCKPIT_MEMORY_SERVER=${COCKPIT_MEMORY_SERVER}
      - COCKPIT_DATABASE=${COCKPIT_DATABASE:-mongodb}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB:-__PROJECT__-qa}
      # S3 storage (optional - only used when STORAGE_ADAPTER=s3). S3_PREFIX
      # defaults to a QA folder so uploads never land on production's assets.
      - STORAGE_ADAPTER=${STORAGE_ADAPTER:-local}
      - S3_URL=${S3_URL}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
      - S3_PREFIX=${S3_PREFIX:-qa}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_ACL=${S3_ACL:-}
      - S3_VERIFY=${S3_VERIFY:-true}
      # Outgoing e-mail (optional - see cockpit/config.php). Unset = no SMTP.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      # CachePurge addon: the Go app's internal address and shared token so
      # Cockpit can POST to /cache/purge when content changes or Replica syncs.
      # Every service in this file is named for the project AND the
      # environment, and the internal URLs use those names.
      #
      # A generic `app`/`cms` is not safe here. Coolify deploys stacks onto a
      # shared predefined network, so this QA stack sitting alongside the
      # production one would register the same names, DNS would round-robin
      # between them, and the application would end up authenticating against
      # the other stack's CMS. That surfaces as `412 {"error":"Authentication
      # failed"}` on some requests and not others, which is miserable to
      # diagnose because the site half works.
      - APP_URL=http://__PROJECT__-qa-app:8080
      - COCKPIT_API_TOKEN=${COCKPIT_API_TOKEN}
    volumes:
      # Uploads and cache still live on disk even when the data is in MongoDB.
      # Named apart from production's volume so the two never share storage.
      # Config and addons are NOT mounted here: Dockerfile.cms bakes the
      # committed cockpit/config.php and addons/ into the image. Relative bind
      # mounts (./cockpit/config.php, ./addons) resolve against the directory
      # where Coolify stores the pasted compose file, not the repo checkout, so
      # they silently mount empty directories. After a deploy that changes an
      # addon, clear storage/cache/modules.cache.php once so the CMS
      # re-registers it on the next boot.
      - cockpit-storage-qa:/var/www/html/storage
    labels:
      - coolify.managed=true
      - traefik.enable=true
      # Same two constraints as the app above: not the compose service name,
      # and not production's router name.
      - traefik.http.routers.__PROJECT__-qa-cmsweb.rule=Host(`${SERVICE_FQDN_CMS}`)
      - traefik.http.routers.__PROJECT__-qa-cmsweb.entrypoints=https
      - traefik.http.routers.__PROJECT__-qa-cmsweb.tls=true
      - traefik.http.routers.__PROJECT__-qa-cmsweb.tls.certresolver=letsencrypt
      - traefik.http.services.__PROJECT__-qa-cmsweb.loadbalancer.server.port=80
  # gosite:addon Commerce

  # QA's own store (design D1/D7): its own Medusa, database and volumes, named
  # for the environment so it never collides with production on the shared
  # network. An order placed here does not exist in production.
  __PROJECT__-qa-medusa:
    image: ghcr.io/avanxo-technology/gosite-medusa:__CORE_VERSION__
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://medusa:${MEDUSA_DB_PASSWORD}@__PROJECT__-qa-medusa-db:5432/medusa?sslmode=disable
      - REDIS_URL=redis://:${MEDUSA_REDIS_PASSWORD}@__PROJECT__-qa-medusa-redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - COMMERCE_REGION=__COMMERCE_REGION__
      - COMMERCE_ADMIN_EMAIL=${COMMERCE_ADMIN_EMAIL:-admin@gosite.local}
      - GOSITE_PURGE_URL=http://__PROJECT__-qa-app:8080/cache/purge
      - GOSITE_PURGE_TOKEN=${COCKPIT_API_TOKEN}
      # QA uses the client's test/sandbox keys (never live keys).
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY:-}
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY:-}
      - WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET:-}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET:-}
      - WOMPI_CHECKOUT_URL=${WOMPI_CHECKOUT_URL:-}
      - WOMPI_API_URL=${WOMPI_API_URL:-}
    volumes:
      - __PROJECT__-qa-commerce-key:/run/gosite-commerce
    depends_on:
      __PROJECT__-qa-medusa-db:
        condition: service_healthy
      __PROJECT__-qa-medusa-redis:
        condition: service_healthy
    networks:
      - default
      - commerce

  __PROJECT__-qa-medusa-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medusa
      - POSTGRES_PASSWORD=${MEDUSA_DB_PASSWORD}
      - POSTGRES_DB=medusa
    volumes:
      - __PROJECT__-qa-medusa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Only on the store's internal network: no other site or stack on the
    # host can reach the database.
    networks:
      - commerce

  __PROJECT__-qa-medusa-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MEDUSA_REDIS_PASSWORD}"]
    volumes:
      - __PROJECT__-qa-medusa-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      - REDIS_PASSWORD=${MEDUSA_REDIS_PASSWORD}
    networks:
      - commerce
  # gosite:end

volumes:
  cockpit-storage-qa:
  # gosite:addon Commerce
  __PROJECT__-qa-commerce-key:
  __PROJECT__-qa-medusa-db:
  __PROJECT__-qa-medusa-redis:
  # gosite:end
# gosite:addon Commerce

networks:
  # The store's private network (internal: no route out, no other stack).
  commerce:
    name: __PROJECT__-qa-commerce
    internal: true
# gosite:end
