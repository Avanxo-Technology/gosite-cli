# generated by gosite generate from gosite.yml - do not edit.
# `gosite generate` rewrites this file. Put local changes in docker-compose.override.yml.
#
# Local development stack for __PROJECT__.
# Redis and MongoDB are NOT defined here: they are the shared gosite
# infrastructure, reachable by container name on the external network.
# Start them with `gosite infra up`.

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    container_name: __PROJECT__-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      APP_ENV: development
      REDIS_URL: "redis://__REDIS_HOST__:__REDIS_PORT__/0"
      COCKPIT_URL: "http://__PROJECT__-cms:80"
      GOSITE_PROJECT: "__PROJECT__"
      # gosite:addon Commerce
      # The site's Go addon reads its store over the project network; the
      # publishable key comes from the shared volume mounted below.
      COMMERCE_URL: "http://__PROJECT__-medusa:9000"
      # gosite:end
    # Host ports stay mapped as a fallback; the domain below is the main entry.
    ports:
      - "__APP_PORT__:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=__NETWORK__
      - traefik.http.routers.__PROJECT__-app.rule=Host(`__DOMAIN__`)
      - traefik.http.routers.__PROJECT__-app.entrypoints=websecure
      - traefik.http.routers.__PROJECT__-app.tls=true
      - traefik.http.services.__PROJECT__-app.loadbalancer.server.port=8080
    volumes:
      # Live source mount: air rebuilds on save.
      - .:/app
      # Named volumes keep the module cache and build artifacts off the host FS.
      - __PROJECT__-gomod:/go/pkg/mod
      - __PROJECT__-tmp:/app/tmp
      # gosite:addon Commerce
      # Read-only: the seed writes the publishable key, the site only reads it.
      - __PROJECT__-commerce-key:/run/gosite-commerce:ro
      # gosite:end
    depends_on:
      - cms
    networks:
      - gosite

  cms:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cms
      # gosite's Cockpit addons, from the gosite installation that generated
      # this file. Production fetches the same directory at the core version.
      additional_contexts:
        gosite-addons: "__ADDONS_CONTEXT_DEV__"
    container_name: __PROJECT__-cms
    restart: unless-stopped
    environment:
      # Cockpit reads these through config.php's ${VAR} resolution.
      COCKPIT_SESSION_NAME: "__PROJECT__"
      COCKPIT_SEC_KEY: "${COCKPIT_SEC_KEY}"
      COCKPIT_MEMORY_SERVER: "redis://__REDIS_HOST__:6379"
      COCKPIT_DATABASE: "__DATABASE__"
      MONGO_HOST: "__MONGO_HOST__"
      MONGO_PORT: "__MONGO_PORT__"
      MONGO_DB: "__PROJECT__"
      STORAGE_ADAPTER: "${STORAGE_ADAPTER}"
      S3_URL: "${S3_URL}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION}"
      S3_KEY: "${S3_KEY}"
      S3_SECRET: "${S3_SECRET}"
      S3_PREFIX: "${S3_PREFIX}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL}"
      S3_ACL: "${S3_ACL:-}"
      S3_VERIFY: "${S3_VERIFY:-true}"
      # Outgoing e-mail (optional - see cockpit/config.php). Empty = no SMTP.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-}"
      # CachePurge addon: the Go app's internal address and shared token so
      # Cockpit can POST to /cache/purge when content changes or Replica syncs.
      # The container name, not the service name: every gosite project has a
      # service called "app" and they all share gosite-network, so "app" resolves
      # to whichever neighbour Docker feels like - and this project's cache purge
      # lands on someone else's site.
      APP_URL: "http://__PROJECT__-app:8080"
      COCKPIT_API_TOKEN: "${COCKPIT_API_TOKEN}"
    ports:
      - "__CMS_PORT__:80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=__NETWORK__
      - traefik.http.routers.__PROJECT__-cms.rule=Host(`__CMS_DOMAIN__`)
      - traefik.http.routers.__PROJECT__-cms.entrypoints=websecure
      - traefik.http.routers.__PROJECT__-cms.tls=true
      - traefik.http.services.__PROJECT__-cms.loadbalancer.server.port=80
    volumes:
      # Config and addons are baked into the image by Dockerfile.cms, not
      # bind-mounted: relative mounts resolve against the directory where
      # Coolify stores the pasted compose file, not the repo checkout, and
      # silently mount empty directories. Storage stays on a volume.
      - ./cockpit-storage:/var/www/html/storage
    networks:
      - gosite
  # gosite:addon Commerce

  # The store's own engine and data (design D1): one Medusa per site and
  # environment, never shared. Managed through Medusa's Admin.
  medusa:
    image: ghcr.io/avanxo-technology/gosite-medusa:__CORE_VERSION__
    container_name: __PROJECT__-medusa
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://medusa:${MEDUSA_DB_PASSWORD}@__PROJECT__-medusa-db:5432/medusa?sslmode=disable"
      REDIS_URL: "redis://:${MEDUSA_REDIS_PASSWORD}@__PROJECT__-medusa-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
      COOKIE_SECRET: "${COOKIE_SECRET}"
      COMMERCE_REGION: "__COMMERCE_REGION__"
      COMMERCE_ADMIN_EMAIL: "${COMMERCE_ADMIN_EMAIL:-admin@gosite.local}"
      # The seed writes the key; a catalogue change asks the site to drop its
      # cached pages through the same token the CMS uses.
      GOSITE_PURGE_URL: "http://__PROJECT__-app:8080/cache/purge"
      GOSITE_PURGE_TOKEN: "${COCKPIT_API_TOKEN}"
      # Payment credentials gate provider registration. Empty by default: only
      # the manual provider is registered until a client's keys are set.
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      WOMPI_PUBLIC_KEY: "${WOMPI_PUBLIC_KEY:-}"
      WOMPI_PRIVATE_KEY: "${WOMPI_PRIVATE_KEY:-}"
      WOMPI_INTEGRITY_SECRET: "${WOMPI_INTEGRITY_SECRET:-}"
      WOMPI_EVENTS_SECRET: "${WOMPI_EVENTS_SECRET:-}"
      WOMPI_CHECKOUT_URL: "${WOMPI_CHECKOUT_URL:-}"
      WOMPI_API_URL: "${WOMPI_API_URL:-}"
      ADMIN_CORS: "https://shop.__DOMAIN__"
      AUTH_CORS: "https://shop.__DOMAIN__"
    volumes:
      # The seed writes the publishable key here; the app mounts it read-only.
      - __PROJECT__-commerce-key:/run/gosite-commerce
    depends_on:
      medusa-db:
        condition: service_healthy
      medusa-redis:
        condition: service_healthy
    networks:
      - gosite
      - commerce

  medusa-db:
    image: postgres:16-alpine
    container_name: __PROJECT__-medusa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: "${MEDUSA_DB_PASSWORD}"
      POSTGRES_DB: medusa
    volumes:
      - __PROJECT__-medusa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Only on the store's internal network: no other site or stack on the
    # host can reach the database.
    networks:
      - commerce

  medusa-redis:
    image: redis:7-alpine
    container_name: __PROJECT__-medusa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MEDUSA_REDIS_PASSWORD}"]
    volumes:
      - __PROJECT__-medusa-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: "${MEDUSA_REDIS_PASSWORD}"
    networks:
      - commerce
  # gosite:end

volumes:
  __PROJECT__-gomod:
  __PROJECT__-tmp:
  # gosite:addon Commerce
  __PROJECT__-commerce-key:
  __PROJECT__-medusa-db:
  __PROJECT__-medusa-redis:
  # gosite:end

networks:
  gosite:
    external: true
    name: __NETWORK__
  # gosite:addon Commerce
  # The store's private network (internal: no route out, no other stack).
  commerce:
    name: __PROJECT__-commerce
    internal: true
  # gosite:end
