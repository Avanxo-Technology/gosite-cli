{{/* Checkout step 2 for Colombia: departamento and municipio. */}}
{{define "content"}}
<form method="post" action="/_commerce/checkout/address"
	hx-post="/_commerce/checkout/address" hx-target="#commerce-checkout" hx-swap="innerHTML"
	class="space-y-4">
	{{with .Error}}<p class="text-sm text-red-600">{{.}}</p>{{end}}
	<div class="grid grid-cols-2 gap-4">
		<label class="block"><span class="text-sm font-medium text-slate-700">Nombres</span>
			<input name="first_name" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
		<label class="block"><span class="text-sm font-medium text-slate-700">Apellidos</span>
			<input name="last_name" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
	</div>
	<label class="block"><span class="text-sm font-medium text-slate-700">Dirección</span>
		<input name="address_1" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
	<label class="block"><span class="text-sm font-medium text-slate-700">Dirección 2 (opcional)</span>
		<input name="address_2" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
	<div class="grid grid-cols-2 gap-4">
		<label class="block"><span class="text-sm font-medium text-slate-700">Departamento</span>
			<input name="province" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
		<label class="block"><span class="text-sm font-medium text-slate-700">Ciudad / Municipio</span>
			<input name="city" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
	</div>
	<div class="grid grid-cols-2 gap-4">
		<label class="block"><span class="text-sm font-medium text-slate-700">Código postal (opcional)</span>
			<input name="postal_code" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
		<label class="block"><span class="text-sm font-medium text-slate-700">Teléfono</span>
			<input name="phone" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"></label>
	</div>
	<button type="submit" hx-disabled-elt="this"
		class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
		Continuar al envío
	</button>
</form>
{{end}}
