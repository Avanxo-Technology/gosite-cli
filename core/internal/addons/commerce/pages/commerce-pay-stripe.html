{{/*
  Embedded payment fragment (Stripe). Rendered on its own when the step has a
  single embedded provider. Stripe.js is loaded only here; the card data never
  reaches the site or Medusa. The site completes the cart after confirm.
*/}}
{{define "content"}}
<div class="commerce-pay-stripe" data-provider="{{.Provider.ID}}"
	data-client-secret="{{.Provider.ClientSecret}}" data-publishable-key="{{.Provider.PublishableKey}}">
	<p class="text-sm text-slate-600">Card payment (Stripe).</p>
	<div id="commerce-stripe-form"></div>
	<button type="button" class="mt-3 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
		Pay now
	</button>
</div>
{{end}}
